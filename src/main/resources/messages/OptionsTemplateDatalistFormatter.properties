org.joget.marketplace.OptionsTemplateDatalistFormatter.label=Options Template Datalist Formatter
org.joget.marketplace.OptionsTemplateDatalistFormatter.desc=Resolves semicolon-separated field values via an options binder and renders each value using a configurable template with {id}, {label} and {grouping} placeholders.
org.joget.marketplace.OptionsTemplateDatalistFormatter.config=Configure Options Template Datalist Formatter
org.joget.marketplace.OptionsTemplateDatalistFormatter.options=Options
org.joget.marketplace.OptionsTemplateDatalistFormatter.options.value=Value
org.joget.marketplace.OptionsTemplateDatalistFormatter.options.label=Label
org.joget.marketplace.OptionsTemplateDatalistFormatter.optionsBinder=Options Binder
org.joget.marketplace.OptionsTemplateDatalistFormatter.template=Template
org.joget.marketplace.OptionsTemplateDatalistFormatter.template.desc=HTML template applied to each resolved value. Use {id} for the raw field value, {label} for the resolved label, and {grouping} for the resolved grouping (only available when the options binder returns a grouping property). Example: <span><a href="view?id={id}">{label}</a></span>
org.joget.marketplace.OptionsTemplateDatalistFormatter.separator=Separator
org.joget.marketplace.OptionsTemplateDatalistFormatter.separator.desc=String placed between rendered items. Leave empty for no separator.
org.joget.marketplace.OptionsTemplateDatalistFormatter.customHeader=Custom Header
org.joget.marketplace.OptionsTemplateDatalistFormatter.customHeader.desc=Raw HTML injected once into the page (e.g. <link> tags). Rendered only on the first row processed per request.